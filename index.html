<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Capture ideas before they disappear.</p>
    </header>

    <main>
      <!-- Section 1: Add a note -->
      <section id="add-note-section">
        <h2>Add a note</h2>
        <form id="note-form">
          <div class="form-group">
            <label for="note-input">New note</label>
            <input
              type="text"
              id="note-input"
              placeholder="Type your note here..."
              autocomplete="off"
            />
          </div>

          <div class="form-group select-group">
            <label for="note-category">Category</label>
            <select id="note-category">
              <option value="Personal">Personal</option>
              <option value="Work">Work</option>
              <option value="Study">Study</option>
            </select>
          </div>

          <button type="submit" id="add-btn">Add Note</button>
        </form>
        <p id="error-message" class="error" aria-live="polite"></p>
      </section>

      <!-- Section 2: Your notes -->
      <section id="notes-display-section">
        <div class="notes-header">
          <h2>Your notes</h2>
          <button type="button" id="clear-all-btn" class="secondary-btn">Clear all</button>
        </div>

        <div class="search-container">
          <input
            type="search"
            id="search-input"
            placeholder="Search notes..."
            autocomplete="off"
          />
        </div>

        <p id="note-count">You have no notes yet.</p>

        <ul id="notes-list"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
  </body>
</html>
